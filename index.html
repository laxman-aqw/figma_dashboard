<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <header class="logo">
                <h2>Outside</h2>
            </header>

            <nav class="nav">
                <ul class="nav-list">
                    <li class="active"><a href="#">Dashboard</a></li>
                    <li><a href="#">Tables</a></li>
                    <li><a href="#">Billing</a></li>
                    <li><a href="#">RTL</a></li>
                </ul>

                <h3 class="section-title">Account Pages</h3>
                <ul class="nav-list">
                    <li><a href="#">Profile</a></li>
                    <li><a href="#">Sign In</a></li>
                    <li><a href="#">Sign Up</a></li>
                </ul>
            </nav>

            <section class="help-card">
                <p><strong>Need help?</strong><br> Please check our docs</p>
                <button>DOCUMENTATION</button>
            </section>

        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <p>Pages / Dashboard</p>
                    <h1>Dashboard</h1>
                </div>

                <div class="topbar-right">
                    <input type="text" placeholder="Type here..." />
                    <a href="#">Sign In</a>
                    <span class="settings">S</span>
                    <span class="notification">N</span>
                </div>
            </header>

            <section class="page-content">

            </section>
            <footer class="footer">
                <p>© 2021. Made with ❤️ by <span>Creative Tim</span> & <span>Simmmple</span> for a better web</p>
                <div class="footer-links">
                    <a href="#">Creative Tim</a>
                    <a href="#">Simmmple</a>
                    <a href="#">Blog</a>
                    <a href="#">License</a>
                </div>
            </footer>
        </main>
    </div>
</body>

</html>
