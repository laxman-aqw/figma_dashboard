<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <header class="logo">
                <h2>Outside</h2>
            </header>

            <nav class="nav">
                <ul class="nav-list">
                    <li class="active"><a href="#">Dashboard</a></li>
                    <li><a href="#">Tables</a></li>
                    <li><a href="#">Billing</a></li>
                    <li><a href="#">RTL</a></li>
                </ul>

                <h3 class="section-title">Account Pages</h3>
                <ul class="nav-list">
                    <li><a href="#">Profile</a></li>
                    <li><a href="#">Sign In</a></li>
                    <li><a href="#">Sign Up</a></li>
                </ul>
            </nav>

            <section class="help-card">
                <p><strong>Need help?</strong><br> Please check our docs</p>
                <button>DOCUMENTATION</button>
            </section>

        </aside>

        <main class="main-dashboard">
            <header class="header">
                <div class="breadcrumbs">
                    <p> <span> Pages</span>&nbsp; /&nbsp; Dashboard</p>
                    <h1>Dashboard</h1>
                </div>

                <div class="search-area">
                    <div class="search-input">
                        <span><ion-icon class="icon magnifying-glass" name="search-sharp"></ion-icon></span>
                        <input id="search-box" type="text" placeholder="Type here..." />
                    </div>
                    <div class="sign-in-space">
                        <ion-icon class="icon" name="person"></ion-icon>
                        <a href="#">Sign In</a>
                    </div>
                    <button class="btn"><span><ion-icon class="icon icon-setting" name="settings-sharp"></ion-icon></span></button>
                    <button class="btn"><span><ion-icon class="icon icon-notification" name="notifications"></ion-icon></span></button>
                </div>
            </header>

            <section class="background">

            </section>
            <footer class="footer">
                <p>© 2021. Made with ❤️ by <span>Creative Tim</span> & <span>Simmmple</span> for a better web</p>
                <div class="footer-links">
                    <a href="#">Creative Tim</a>
                    <a href="#">Simmmple</a>
                    <a href="#">Blog</a>
                    <a href="#">License</a>
                </div>
            </footer>
        </main>
    </div>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script></body>

</html>
